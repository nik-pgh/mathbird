[project]
name = "mathbird-backend"
version = "0.1.0"
description = "LiveKit voice agent backend for mathbird"
requires-python = ">=3.11"
dependencies = [
    # LiveKit agent runtime
    "livekit-agents[deepgram,openai,cartesia,elevenlabs,silero,turn-detector]>=1.2.0",
    "livekit-api>=1.0.0",
    # HTTP API
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "python-multipart>=0.0.20",
    # Config
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "python-dotenv>=1.0.1",
    "pyyaml>=6.0.0",
    # Storage (S3 backend is optional at runtime — only imported when selected)
    "boto3>=1.35.0",
    # RAG
    "llama-cloud>=1.0.0",
    "llama-index>=0.13.0",
    "llama-index-embeddings-openai>=0.5.0",
    "llama-index-embeddings-cohere>=0.8.0",
    "llama-index-embeddings-voyageai>=0.6.0",
    "llama-index-embeddings-google-genai>=0.5.1",
    "llama-index-embeddings-mistralai>=0.5.0",
    "llama-index-embeddings-jinaai>=0.6.0",
    "llama-index-vector-stores-qdrant>=0.7.0",
    "qdrant-client>=1.15.0",
    # Observability (Arize Phoenix + OpenInference). Always installed;
    # enable export with PHOENIX_ENABLED=true. Version caps keep livekit-agents
    # 1.3.x compatible (see openinference-instrumentation-openai note below).
    "arize-phoenix>=8.0.0",
    "openinference-instrumentation-openai>=0.1.0,<0.1.45",
    "openinference-instrumentation-llama-index>=4.0.0",
    "opentelemetry-sdk>=1.34.1,<1.38",
    "opentelemetry-semantic-conventions<0.59b0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.7.0",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.27.0",
]
embeddings-huggingface = [
    "llama-index-embeddings-huggingface>=0.5.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[dependency-groups]
dev = [
    "pymupdf>=1.27.2.3",
]
