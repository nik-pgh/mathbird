[project]
name = "mathbird-backend"
version = "0.1.0"
description = "LiveKit voice agent backend for mathbird"
requires-python = ">=3.11"
dependencies = [
    # LiveKit agent runtime
    "livekit-agents[deepgram,openai,cartesia,elevenlabs,silero,turn-detector]>=1.2.0",
    "livekit-api>=1.0.0",

    # HTTP API
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "python-multipart>=0.0.20",

    # Config
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "python-dotenv>=1.0.1",
    "pyyaml>=6.0.0",

    # Storage (S3 backend is optional at runtime — only imported when selected)
    "boto3>=1.35.0",

    # RAG
    "llama-cloud>=1.0.0",
    "llama-index>=0.13.0",
    "llama-index-embeddings-openai>=0.5.0",
    "llama-index-vector-stores-qdrant>=0.7.0",
    "qdrant-client>=1.15.0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.7.0",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.27.0",
]
observability = [
    "arize-phoenix>=8.0.0",
    # Cap openinference-instrumentation-openai below the version that
    # started emitting GEN_AI_USAGE_CACHE_READ_INPUT_TOKENS. Bumping past
    # this requires newer opentelemetry-sdk which breaks livekit-agents
    # 1.3.x (uses ``LogData`` removed in SDK 1.41). Revisit when livekit
    # moves to the newer SDK.
    "openinference-instrumentation-openai>=0.1.0,<0.1.45",
    "openinference-instrumentation-llama-index>=4.0.0",
    "opentelemetry-sdk>=1.34.1,<1.38",
    "opentelemetry-semantic-conventions<0.59b0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
