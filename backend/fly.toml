# Fly.io deployment config for the mathbird FastAPI HTTP API.
#
# The voice agent worker is NOT deployed here — it ships separately to
# LiveKit Cloud Agents via livekit.toml + Dockerfile.
#
# First-time setup:
#   brew install flyctl
#   fly auth login
#   cd backend
#   # Edit `app =` below to a globally-unique name, then:
#   fly apps create mathbird-api-<your-suffix>
#   fly secrets import < ../.env       # pushes all .env values as secrets
#   fly deploy
#
# Subsequent deploys:
#   fly deploy

app = "mathbird"                  # must be globally unique across Fly
primary_region = "iad"            # iad=Virginia (matches LiveKit US East B). Change with `fly regions`.

[build]
  dockerfile = "Dockerfile.api"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = "stop"     # scale to zero when idle to save money
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "10s"
    method = "GET"
    path = "/health"

[[vm]]
  size = "shared-cpu-1x"
  memory = "1gb"                  # ~$3/mo; drop to 512mb once you've observed actual usage