# Demonstration scenario for per-turn progression evaluation.
#
# Requires the hand-authored syllabus at
# simulations/fixtures/progression_demo_syllabus.json to be loaded into storage
# at key ``progression-demo/syllabus.json`` before running (see tests/simulation
# for the load helper). Decouples progression eval from LlamaParse.
#
# This scenario is deterministic: each turn scripts a ``grader_result`` consumed
# by ``FakeGrader`` in ``scripts/simulate_conversation.py``.
name: progression_demo
doc_id: progression-demo
turns:
  - student: "Can we work on problem 1? It's x + 3 = 7."
    grader_result:
      set_focus_node_id: "ch-1-p-1"
    expect:
      focus_node: "ch-1-p-1"
      node_level:
        ch-1-p-1: "practicing"

  - student: "I subtracted 3 from both sides so x is 4."
    board_text: "x + 3 = 7\nx = 4"
    grader_result:
      updates:
        - node_id: "ch-1-p-1"
          level: "proficient"
    expect:
      focus_node: "ch-1-p-1"
      node_level:
        ch-1-p-1: "proficient"

  - student: "Because subtracting 3 from both sides keeps it balanced, and 7 minus 3 is 4."
    grader_result:
      updates:
        - node_id: "ch-1-p-1"
          level: "mastered"
    expect:
      focus_node: "ch-1-p-1"
      node_level:
        ch-1-p-1: "mastered"
      next_suggestion_node: "ch-1-p-2"
